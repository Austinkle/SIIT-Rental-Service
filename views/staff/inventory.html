<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory · SIIT Rental Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body data-role="staff">
<nav id="nav"></nav>

<header class="page-header">
  <div>
    <div class="eyebrow font-display">Library staff · Rangsit &amp; Bangkadi</div>
    <h1 class="font-display">Inventory</h1>
    <p>Search the equipment list, mark items borrowed or available, and add or remove equipment.</p>
  </div>
</header>

<div class="page-body narrow">
<form id="searchForm" class="filter-row">
  <input id="search" type="search" class="input" style="max-width: 420px" placeholder="Search by equipment or category name">
  <button type="submit" class="btn btn-dark">Search</button>
</form>

<div id="categories"></div>
<div class="filter-row">
  <div id="location"></div>
  <button type="button" id="addBtn" class="add-btn" style="margin-left: auto; margin-bottom: 10px;">+ Add equipment</button>
</div>

<p id="message" class="note-line"></p>
<div class="table-wrap"><table id="equip"></table></div>
</div>

<!-- Add equipment pop-up -->
<dialog id="addDialog">
  <form id="addForm">
    <h3>Add equipment</h3>

    <label>Equipment name
      <input type="text" id="addName" maxlength="100" required>
    </label>

    <label>Category
      <select id="addCategory" required></select>
    </label>

    <label>Location
      <select id="addLocationSelect" required>
        <option value="">Select location</option>
        <option value="Rangsit">Rangsit</option>
        <option value="Bangkadi">Bangkadi</option>
      </select>
    </label>

    <label>Quantity
      <input type="number" id="addQuantity" min="1" max="100" value="1" required>
    </label>

    <label>Description (optional)
      <textarea id="addDescription" rows="3" maxlength="1000"></textarea>
    </label>

    <p id="addError" class="dlg-error" role="alert" hidden></p>
    <div class="dlg-actions">
      <button type="button" class="btn btn-outline" id="addCancel">Cancel</button>
      <button type="submit" class="btn btn-dark" id="addConfirm">Save item</button>
    </div>
  </form>
</dialog>

<script src="/icons.js"></script>
<script src="/ui.js"></script>
<script src="/nav.js"></script>
<script>
const searchBox = document.getElementById('search');
const table = document.getElementById('equip');
const message = document.getElementById('message');

let selectedCategory = null;   // null = all categories
let selectedLocation = null;   // null = both campuses
let latestCall = 0;

function makeButton(label, onClick, cls) {
  const btn = document.createElement('button');
  btn.textContent = label;
  btn.className = cls || 'btn btn-outline';
  btn.style.marginRight = '6px';
  btn.addEventListener('click', onClick);
  return btn;
}

// ----- category buttons (also fills the category list of the Add form) -----
async function loadCategories() {
  const res = await fetch('/staff/api/categories');
  if (!res.ok) return;
  const cats = await res.json();

  const box = document.getElementById('categories');
  box.innerHTML = '';
  addCategoryButton(box, 'All', null);
  cats.forEach(c => addCategoryButton(box, c.category_name, c.category_id));

  const select = document.getElementById('addCategory');
  select.innerHTML = '';
  select.add(new Option('Select category', ''));
  cats.forEach(c => select.add(new Option(c.category_name, c.category_id)));
}

function addCategoryButton(box, label, id) {
  const btn = document.createElement('button');
  btn.textContent = label;
  btn.className = 'cat-btn' + (id === selectedCategory ? ' active' : '');
  btn.addEventListener('click', () => {
    selectedCategory = id;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    load();
  });
  box.appendChild(btn);
}

// ----- location buttons -----
async function loadLocation() {
  const res = await fetch('/staff/api/location');
  if (!res.ok) return;
  const locs = await res.json();

  const box = document.getElementById('location');
  box.innerHTML = '';
  addLocationButton(box, 'Both Campuses', null);
  locs.forEach(l => addLocationButton(box, l.location, l.location));
}

function addLocationButton(box, label, val) {
  const btn = document.createElement('button');
  btn.textContent = label;
  btn.className = 'loc-btn' + (val === selectedLocation ? ' active' : '');
  btn.addEventListener('click', () => {
    selectedLocation = val;
    document.querySelectorAll('.loc-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    load();
  });
  box.appendChild(btn);
}

// ----- send a change to the server, show its error message if there is one -----
async function send(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) alert(data.error || 'Something went wrong');
  return res.ok;
}

async function markEquipment(r, action) {          // action: 'borrowed' or 'available'
  await send('POST', '/staff/api/equipment/' + r.equipment_id + '/mark', { action });
  load();                                          // refresh either way
}

async function deleteEquipment(r) {
  if (!confirm('Delete "' + r.name + '"? It will disappear from the catalog.')) return;
  await send('DELETE', '/staff/api/equipment/' + r.equipment_id);
  load();
}

// ----- equipment list -----
async function load() {
  const thisCall = ++latestCall;

  let url = '/staff/api/equipment?q=' + encodeURIComponent(searchBox.value);
  if (selectedCategory !== null) url += '&category=' + selectedCategory;
  if (selectedLocation !== null) url += '&location=' + encodeURIComponent(selectedLocation);

  const res = await fetch(url);
  if (thisCall !== latestCall) return;

  table.innerHTML = '';
  if (!res.ok) { message.textContent = 'Could not load equipment'; return; }

  const rows = await res.json();
  message.textContent = rows.length === 0 ? 'No equipment found' : '';
  if (rows.length === 0) return;

  const head = table.createTHead().insertRow();
  ['Name', 'Category', 'Id', 'Status', 'Qty', 'Location', 'Description', ''].forEach(t => {
    const th = document.createElement('th');
    th.textContent = t;
    head.appendChild(th);
  });

  const body = table.createTBody();
  rows.forEach(r => {
    const tr = body.insertRow();
    tr.insertCell().textContent = r.name;
    tr.insertCell().textContent = r.category_name;
    tr.insertCell().textContent = r.equipment_id;
    tr.insertCell().textContent = r.available_quantity > 0 ? 'Available' : 'Borrowed';
    tr.insertCell().textContent = r.available_quantity + ' / ' + r.total_quantity;
    tr.insertCell().textContent = r.location;
    tr.insertCell().textContent = r.description;

    const actions = tr.insertCell();
    if (r.available_quantity > 0)                  // something on the shelf: can mark one as borrowed
      actions.appendChild(makeButton('Mark borrowed', () => markEquipment(r, 'borrowed')));
    if (r.desk_loans > 0)                          // something lent at the desk: can put it back
      actions.appendChild(makeButton('Mark available', () => markEquipment(r, 'available')));
    const actions2 = tr.insertCell();
    const del = makeButton('X', () => deleteEquipment(r), 'btn btn-danger');
    del.title = 'Delete equipment';
    actions2.appendChild(del);
  });
}

// ----- clear every filter, so a new item is always visible -----
function resetFilters() {
  selectedCategory = null;
  selectedLocation = null;
  searchBox.value = '';
  loadCategories();
  loadLocation();
  load();
}

// ----- add equipment pop-up -----
const addDialog = document.getElementById('addDialog');
const addForm = document.getElementById('addForm');
const addError = document.getElementById('addError');
const addConfirm = document.getElementById('addConfirm');

document.getElementById('addBtn').addEventListener('click', () => {
  addForm.reset();                    // empty fields, quantity back to 1
  addError.hidden = true;
  addDialog.showModal();
});

document.getElementById('addCancel').addEventListener('click', () => addDialog.close());

addForm.addEventListener('submit', async event => {
  event.preventDefault();
  addError.hidden = true;
  addConfirm.disabled = true;

  try {
    const res = await fetch('/staff/api/equipment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('addName').value,
        category_id: document.getElementById('addCategory').value,
        location: document.getElementById('addLocationSelect').value,
        quantity: document.getElementById('addQuantity').value,
        description: document.getElementById('addDescription').value
      })
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok) {
      addDialog.close();
      resetFilters();                 // show the full list, including the new item
      return;
    }
    addError.textContent = data.error || 'Could not save the item';
    addError.hidden = false;
  } catch {
    addError.textContent = 'Network error. Please try again.';
    addError.hidden = false;
  } finally {
    addConfirm.disabled = false;
  }
});

// ----- search form -----
document.getElementById('searchForm').addEventListener('submit', event => {
  event.preventDefault();
  load();
});

// ----- start -----
load();
loadCategories();
loadLocation();
</script>
</body>
</html>
