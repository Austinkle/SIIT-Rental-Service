<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overdue · SIIT Rental Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body data-role="staff">
<nav id="nav"></nav>

<header class="page-header">
  <div>
    <div class="eyebrow font-display">Library staff · Rangsit &amp; Bangkadi</div>
    <h1 class="font-display">Overdue</h1>
    <p>Rentals that were returned after the due date, or are past the due date and not returned yet.</p>
  </div>
</header>

<div class="page-body narrow">
  <div id="kinds"></div>
  <div class="table-wrap"><table id="overdue"></table></div>
</div>

<script src="/icons.js"></script>
<script src="/ui.js"></script>
<script src="/nav.js"></script>
<script src="/shared.js"></script>
<script>
  const showDate = v => new Date(v).toLocaleDateString();
  const showDateTime = v => new Date(v).toLocaleString();
  const DAY = 24 * 60 * 60 * 1000;
  let kind = 'all';

  // ----- filter buttons: All / Not returned yet / Returned late -----
  [['all', 'All'], ['not_returned', 'Not returned yet'], ['returned_late', 'Returned late']]
    .forEach(([value, label]) => {
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.className = 'cat-btn' + (value === kind ? ' active' : '');
      btn.addEventListener('click', () => {
        kind = value;
        document.querySelectorAll('#kinds .cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadOverdue();
      });
      document.getElementById('kinds').appendChild(btn);
    });

  // ----- table cells -----
  function returnedCell(r) {
    return document.createTextNode(r.return_date ? showDateTime(r.return_date) : 'Not returned');
  }

  function notifiedCell(r) {
    return document.createTextNode(
      r.times_notified === 0 ? '-' : r.times_notified + 'x (last: ' + showDateTime(r.last_notified) + ')');
  }

  function notifyCell(r) {
    const box = document.createElement('span');
    const recent = r.last_notified && (Date.now() - new Date(r.last_notified).getTime()) < DAY;

    const btn = document.createElement('button');
    btn.textContent = 'Notify';
    btn.className = 'btn btn-dark';
    btn.disabled = !!recent;
    btn.title = recent ? 'Already notified in the last 24 hours' : 'Send a notification to the student';
    btn.addEventListener('click', () => notify(r));
    box.appendChild(btn);
    return box;
  }

  async function notify(r) {
    if (!confirm('Send a notification to ' + r.student + ' about "' + r.equipment + '"?')) return;

    const res = await fetch('/staff/api/overdue/' + r.transaction_id + '/notify', { method: 'POST' });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert(data.error || 'Could not send the notification');
    }
    loadOverdue();       // refresh either way
  }

  function loadOverdue() {
    loadTable('/staff/api/overdue?kind=' + kind, 'overdue', [
      { key: 'equipment',   label: 'Equipment' },
      { key: 'student',     label: 'Student' },
      { key: 'location',    label: 'Location' },
      { key: 'borrow_date', label: 'Borrowed', format: showDate },
      { key: 'due_date',    label: 'Due',      format: showDate },
      { label: 'Returned',  render: returnedCell },
      { key: 'days_late',   label: 'Days late' },
      { label: 'Notified',  render: notifiedCell },
      { label: '',          render: notifyCell }
    ]);
  }

  loadOverdue();
  setInterval(loadOverdue, 60000);    // refresh every minute
</script>
</body>
</html>
