<link rel="stylesheet" href="/style.css">
<body data-role="student">
<nav id="nav"></nav>

<h1>Equipment</h1>
<table id="equip" border="1"></table>

<script src="/nav.js"></script>
<script>
async function load() {
  const res = await fetch('/student/api/equipment');
  const rows = await res.json();
  const table = document.getElementById('equip');
  table.innerHTML = '';
  rows.forEach(r => {
    const tr = table.insertRow();
    tr.insertCell().textContent = r.name;
    tr.insertCell().textContent = r.available_quantity;
    const btn = document.createElement('button');
    btn.textContent = 'Request';
    btn.onclick = () => requestItem(r.equipment_id);
    tr.insertCell().appendChild(btn);
  });
}

async function requestItem(id) {
  const res = await fetch('/student/api/requests', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ equipment_id: id })
  });
  alert(res.ok ? 'Request sent' : 'Could not send request');
}

load();
</script>
