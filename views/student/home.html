<link rel="stylesheet" href="/style.css">
<body data-role="student">
<nav id="nav"></nav>

<p style="line-height: 1.6;">
  BORROW IT.<br>
  USE IT.<br>
  BRING IT BACK.
</p>
<h2>SEARCH</h2>
<form id="searchForm">
  <input id="search" type="search" placeholder="Search by equipment or category name" size="40">
  <button type="submit">Search</button>
</form>
<div id="categories"></div>
<p id="message"></p>
<table id="equip" border="1"></table>

<script src="/nav.js"></script>
<script>
const searchBox = document.getElementById('search');
const table = document.getElementById('equip');
const message = document.getElementById('message');

let selectedCategory = null;   // null = all categories
let latestCall = 0;

// ----- category buttons -----
async function loadCategories() {
  const res = await fetch('/student/api/categories');
  if (!res.ok) return;
  const cats = await res.json();

  const box = document.getElementById('categories');
  box.innerHTML = '';
  addCategoryButton(box, 'All', null);
  cats.forEach(c => addCategoryButton(box, c.category_name, c.category_id));
}

function addCategoryButton(box, label, id) {
  const btn = document.createElement('button');
  btn.textContent = label;
  btn.className = 'cat-btn' + (id === selectedCategory ? ' active' : '');

  btn.addEventListener('click', () => {
    selectedCategory = id;                                  // remember which category
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');                            // highlight this one
    load();                                                 // reload the list
  });

  box.appendChild(btn);
}

// ----- equipment list -----
async function load() {
  const thisCall = ++latestCall;

  let url = '/student/api/equipment?q=' + encodeURIComponent(searchBox.value);
  if (selectedCategory !== null) url += '&category=' + selectedCategory;

  const res = await fetch(url);
  if (thisCall !== latestCall) return;

  table.innerHTML = '';
  if (!res.ok) { message.textContent = 'Could not load equipment'; return; }

  const rows = await res.json();
  message.textContent = rows.length === 0 ? 'No equipment found' : '';
  if (rows.length === 0) return;

  const head = table.createTHead().insertRow();
  ['Name', 'Category', 'Available', 'Status',''].forEach(t => {
    const th = document.createElement('th');
    th.textContent = t;
    head.appendChild(th);
  });

  const body = table.createTBody();
  rows.forEach(r => {
    const tr = body.insertRow();
    tr.insertCell().textContent = r.name;
    tr.insertCell().textContent = r.category_name;
    tr.insertCell().textContent = r.available_quantity;
    tr.insertCell().textContent = r.status;
    if(r.available_quantity != 0){
      const btn = document.createElement('button');
    btn.textContent = 'Request Rental';
    btn.addEventListener('click', () => requestItem(r.equipment_id));
    tr.insertCell().appendChild(btn);
    }
  });
}

async function requestItem(id) {
  const res = await fetch('/student/api/requests', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ equipment_id: id })
  });
  alert(res.ok ? 'Request sent' : 'Could not send request');
}

// ----- search form -----
document.getElementById('searchForm').addEventListener('submit', event => {
  event.preventDefault();
  load();
});

// ----- start -----
load();
loadCategories();
</script>
